name: ZASI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zasi
          POSTGRES_PASSWORD: zasi
          POSTGRES_DB: zasi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U zasi -d zasi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ZASI_TEST_POSTGRES_URL: postgresql://zasi:zasi@127.0.0.1:5432/zasi_test
      ZASI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "${{ matrix.python-version }}" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22.14.0" }
      - name: Install and build bundled cockpit
        run: |
          npm ci --ignore-scripts --no-audit
          npm run typecheck
          npm run build
          npm run world-room:build
      - name: Install dependencies
        run: pip install '.[dev]' build coverage
      - name: Audit project Python dependencies
        run: |
          audit_env="$RUNNER_TEMP/zasi-python-audit"
          python3 -m venv "$audit_env"
          "$audit_env/bin/python" -m pip install --upgrade pip setuptools wheel
          "$audit_env/bin/python" -m pip install '.[dev]' pip-audit
          "$audit_env/bin/pip-audit" --local
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -q
      - name: Run identity foundation acceptance evidence
        run: make test-identity-foundation
      - name: Run coverage
        run: |
          coverage run -m unittest discover -s tests -q
          coverage report --fail-under=60
          COVERAGE_PCT=$(coverage report | tail -1 | awk '{print $NF}')
          echo "### Coverage: $COVERAGE_PCT" >> $GITHUB_STEP_SUMMARY
      - name: Run cockpit, World Room, and Electron boundary tests
        run: npm test

  build:
    name: Build Distribution
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22.14.0" }
      - name: Build bundled cockpit before packaging
        run: |
          npm ci --ignore-scripts --no-audit
          npm run typecheck
          npm run build
          npm run world-room:build
      - run: pip install '.[dev]' build
      - name: Build wheel and sdist
        run: python3 -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zasi-dist
          path: dist/

  docker:
    name: Docker Build Check
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Docker image
        run: docker build -t zasi:ci .

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
