name: ZASI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Install and build bundled cockpit
        run: npm ci --ignore-scripts && npm audit --omit=dev && npm run typecheck && npm run build
      - name: Install dependencies
        run: pip install '.[dev]' build coverage
      - name: Audit project Python dependencies
        run: |
          audit_env="$RUNNER_TEMP/zasi-python-audit"
          python3 -m venv "$audit_env"
          "$audit_env/bin/python" -m pip install --upgrade pip setuptools wheel
          "$audit_env/bin/python" -m pip install '.[dev]' pip-audit
          "$audit_env/bin/pip-audit" --local
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -q
      - name: Run coverage
        run: |
          coverage run -m unittest discover -s tests -q
          coverage report --fail-under=60
          COVERAGE_PCT=$(coverage report | tail -1 | awk '{print $NF}')
          echo "### Coverage: $COVERAGE_PCT" >> $GITHUB_STEP_SUMMARY
      - name: Run cockpit and Electron boundary tests
        run: npm test

  build:
    name: Build Distribution
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Build bundled cockpit before packaging
        run: npm ci --ignore-scripts && npm audit --omit=dev && npm run typecheck && npm run build
      - run: pip install '.[dev]' build
      - name: Build wheel and sdist
        run: python3 -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zasi-dist
          path: dist/

  docker:
    name: Docker Build Check
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t zasi:ci .
