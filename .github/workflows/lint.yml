name: Lint & Code Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Python Syntax & React TypeScript Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.11" }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "22.14.0" }
      - name: Validate Python Syntax across governed and legacy adapters
        run: python3 -m compileall -q src backend main.py
      - name: Validate React Components
        run: node tests/test_components.js
      - name: Build bundled cockpit
        run: npm ci --ignore-scripts && npm run typecheck && npm run build
