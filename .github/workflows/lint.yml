name: Lint & Code Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Python Syntax & React TypeScript Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Validate Python Syntax across governed and legacy adapters
        run: python3 -m compileall -q src backend main.py
      - name: Validate React Components
        run: node tests/test_components.js
      - name: Build bundled cockpit
        run: npm ci --ignore-scripts && npm run typecheck && npm run build
