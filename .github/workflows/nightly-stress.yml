name: Nightly Governed Regression

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    name: Subsystem & Invariant Verification Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install '.[dev]' build coverage
      - name: Run governed regression and safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Run governed control-plane security smoke tests
        run: python3 -m unittest tests.test_security_hardening tests.test_egress_security tests.test_control_plane_api -v
