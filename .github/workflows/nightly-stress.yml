name: Nightly Superintelligence Stress Benchmark

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    name: Subsystem & Invariant Verification Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install dependencies
        run: pip install build coverage
      - name: Run Full Stress Tests & SMT Benchmark
        run: python3 -m unittest discover -s tests -v
      - name: Run Dialectical Pipeline 148-Stage Step
        run: python3 main.py
