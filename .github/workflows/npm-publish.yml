name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish zasi-cockpit to npm Registry
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/zasi-cockpit
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Run Component Structural Tests
        run: node tests/test_components.js

      - name: Build bundled cockpit
        run: npm ci --ignore-scripts && npm run typecheck && npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
