name: Publish to npm

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish zasi-cockpit to npm Registry
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/zasi-cockpit
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        # NOTE: no registry-url here on purpose. setup-node would write an
        # _authToken=${NODE_AUTH_TOKEN} line into .npmrc, and that (empty)
        # credential shadows the OIDC trusted-publishing exchange.
        # The default registry (registry.npmjs.org) is used.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"

      - name: Run Component Structural Tests
        run: node tests/test_components.js

      - name: Build bundled cockpit
        run: |
          scripts/npm_ci_audit.sh
          npm run typecheck
          npm run build

      - name: Publish to npm
        # Trusted publishing via GitHub OIDC (id-token: write above).
        # No NODE_AUTH_TOKEN: a static token would override the OIDC exchange.
        # npm >= 11.5.1 is required for the OIDC exchange; runners may ship older npm.
        run: |
          npm install -g "npm@>=11.5.1"
          npm publish --access public
