name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Create GitHub Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Python Package to PyPI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zasi
    permissions:
      actions: read
      id-token: write
      contents: read
    steps:
      - name: Checkout the signed release workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download signed release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zasi-signed-release
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify signed release artifact
        env:
          ZASI_RELEASE_GPG_FINGERPRINT: ${{ secrets.ZASI_RELEASE_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          test -n "$ZASI_RELEASE_GPG_FINGERPRINT"
          test -s dist/ZASI_RELEASE_SIGNING_KEY.asc
          printf '%s\n' "$ZASI_RELEASE_GPG_FINGERPRINT" | grep -Eq '^[0-9A-Fa-f]{16,64}$'
          expected_fingerprint="$(printf '%s' "$ZASI_RELEASE_GPG_FINGERPRINT" | tr '[:lower:]' '[:upper:]')"
          gpg --batch --import dist/ZASI_RELEASE_SIGNING_KEY.asc >/dev/null 2>&1
          for artifact in dist/*.whl dist/*.tar.gz dist/zasi-sbom.cdx.json dist/SHA256SUMS; do
            test -f "$artifact"
            test -f "${artifact}.asc"
            status_output="$(gpg --batch --status-fd 1 --verify "${artifact}.asc" "$artifact" 2>/dev/null)"
            printf '%s\n' "$status_output" | grep -F "VALIDSIG $expected_fingerprint " >/dev/null
          done
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Stage PyPI distributions
        run: |
          set -euo pipefail
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          test -n "$(ls -A pypi-dist)"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
