name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build & Release Binary Packages
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Enforce production GO evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || {
            echo "release commit is not contained in origin/main" >&2
            exit 2
          }

          test -f evidence/staging/latest.json || {
            echo "missing evidence/staging/latest.json; production release remains NO-GO" >&2
            exit 2
          }

          RULESET_DIR="$RUNNER_TEMP/zasi-rulesets"
          mkdir -p "$RULESET_DIR"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true" \
            > "$RULESET_DIR/index.json"

          jq -r '.[].id' "$RULESET_DIR/index.json" | while read -r ruleset_id; do
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
              > "$RULESET_DIR/${ruleset_id}.json"
          done
          find "$RULESET_DIR" -maxdepth 1 -type f -name '*.json' ! -name 'index.json' -print0 \
            | sort -z \
            | xargs -0 -r jq -s '.' > "$RULESET_DIR/expanded.json"
          test -s "$RULESET_DIR/expanded.json" || printf '[]\n' > "$RULESET_DIR/expanded.json"

          python scripts/production_go_gate.py \
            --evidence evidence/staging/latest.json \
            --expected-commit "$RELEASE_COMMIT" \
            --rulesets "$RULESET_DIR/expanded.json" \
            --output production-go-decision.json

      - name: Upload production GO decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-go-decision-${{ github.sha }}
          path: production-go-decision.json
          if-no-files-found: error
          retention-days: 90

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.14.0"

      - name: Build bundled cockpit before packaging
        run: |
          scripts/npm_ci_audit.sh
          npm run typecheck
          npm run build

      - name: Install build and SBOM tooling
        run: pip install '.[dev]' build

      - name: Build Wheel & Tarball
        run: python3 -m build

      - name: Generate SBOM and checksums
        run: |
          python3 scripts/generate_sbom.py --output dist/zasi-sbom.cdx.json --resolve-installed

      - name: Import protected release signing key
        env:
          ZASI_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.ZASI_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ZASI_RELEASE_GPG_PRIVATE_KEY"
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye || true
          printf '%s' "$ZASI_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign and verify release artifacts
        env:
          ZASI_RELEASE_GPG_FINGERPRINT: ${{ secrets.ZASI_RELEASE_GPG_FINGERPRINT }}
          ZASI_RELEASE_GPG_PASSPHRASE: ${{ secrets.ZASI_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ZASI_RELEASE_GPG_FINGERPRINT"
          python3 scripts/sign_release_artifacts.py \
            --output-dir dist \
            --fingerprint "$ZASI_RELEASE_GPG_FINGERPRINT"

      - name: Upload signed package bundle for PyPI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zasi-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/zasi-sbom.cdx.json
            dist/SHA256SUMS
            dist/*.asc
            dist/ZASI_RELEASE_SIGNING_KEY.asc
            production-go-decision.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
