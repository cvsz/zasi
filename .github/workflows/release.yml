name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build & Release Binary Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install build and SBOM tooling
        run: pip install '.[dev]' build

      - name: Build bundled cockpit before packaging
        run: npm ci --ignore-scripts && npm run typecheck && npm run build

      - name: Build Wheel & Tarball
        run: python3 -m build

      - name: Generate SBOM and checksums
        run: |
          python3 scripts/generate_sbom.py --output dist/zasi-sbom.cdx.json --resolve-installed
          sha256sum dist/*.whl dist/*.tar.gz dist/zasi-sbom.cdx.json > dist/SHA256SUMS

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/zasi-sbom.cdx.json
            dist/SHA256SUMS
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
