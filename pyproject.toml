[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zasi"
version = "32.0.0"
description = "Governed J.A.R.V.I.S. control-plane reference platform"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ZASI Core Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "redis>=5.0.0,<7.0.0",
    "cryptography>=46.0.7,<51.0.0",
]

[project.optional-dependencies]
formal = [
    "z3-solver>=4.12.0"
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "httpx>=0.28.0,<1.0.0"
]

[project.scripts]
zasi = "backend.app:run"
zasi-legacy = "src.cli:main"
zasi-demo = "main:legacy_demo_main"
zasi-backup = "scripts.backup_control_plane:main"
zasi-outbox-worker = "scripts.run_outbox_worker:main"
zasi-action-worker = "scripts.run_action_worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*", "scripts*"]

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.data-files]
"share/zasi/web" = ["web/dist/index.html", "web/dist/assets/*"]
